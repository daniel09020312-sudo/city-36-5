<!doctype html>
<html lang="ko">
  <head>

    <title>36.5 — 이상사회</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link

  <body>
    <canvas id="gl" aria-label="36.5 도시 3D 화면"></canvas>

    <header id="top">
      <button id="brand" type="button" aria-label="처음으로">
        <b>36.5</b><span id="brand-sub"></span>
      </button>
      <ol id="progress" aria-label="장면"></ol>
      <div id="mode" role="group" aria-label="보기 방식">
        <button type="button" data-mode="tour" class="on"></button>
        <button type="button" data-mode="free"></button>
      </div>
    </header>

    <div id="hud" aria-live="off"></div>

    <aside id="panel" aria-live="polite">
      <div id="panel-inner">
        <p id="kicker"><i></i><span></span></p>
        <h1 id="title"></h1>
        <div id="body"></div>
        <div id="example"><span></span><p></p></div>
        <div id="meaning"><span></span><p></p></div>
        <p id="tryit"><span></span><em></em></p>
        <div id="controls"></div>
        <a id="article" target="_blank" rel="noopener noreferrer"><span class="a-k"></span><b></b><i></i><p></p><em></em></a>
      </div>
    </aside>

    <div id="free-hint"></div>

    <nav id="nav" aria-label="장면 이동">
      <button id="prev" type="button" class="btn ghost"></button>
      <span id="counter"></span>
      <button id="next" type="button" class="btn primary"></button>
    </nav>

    <section id="intro">
      <p class="intro-project"></p>
      <h1 class="intro-title"><span>36.5</span></h1>
      <p class="intro-sub"></p>
      <button id="enter" type="button" class="btn primary big"></button>
      <p class="intro-hint"></p>
    </section>

    <section id="ending">
      <p class="ending-rule"></p>
      <blockquote class="ending-quote"></blockquote>
      <div class="ending-practice"></div>
      <div class="ending-actions">
        <button id="restart" type="button" class="btn ghost"></button>
        <button id="explore" type="button" class="btn primary"></button>
      </div>
    </section>

    <div id="fallback" hidden>
      <p>이 기기에서는 3D 화면(WebGL)을 열 수 없습니다. 다른 브라우저나 기기에서 열어 주세요.</p>
    </div>

    <script type="module" src="/src/main.js"></script>

</html>
